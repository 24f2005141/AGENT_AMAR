<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" style="background:#0b132b; font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="m-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="m-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="m-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="m-grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="m-grad-novelty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="m-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="m-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="m-arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="700" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.8">AGENT AMAR: DETAILED MATHEMATICAL MODEL &amp; NOVELTY ARCHITECTURE</text>
  <text x="700" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Layer Specifications, Tensor Dimensions, Cascaded Decision Gates, and Deterministic Multi-Agent Arbitration</text>

  <!-- ==================== LEFT COLUMN: INPUT & FEATURE TRANSFORMATION ==================== -->
  <g transform="translate(40, 105)">
    <!-- Stage Box -->
    <rect width="380" height="800" rx="12" fill="#1c2541" stroke="#334155" stroke-width="1.5"/>
    <rect width="380" height="40" rx="12" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="190" y="25" text-anchor="middle" fill="#38bdf8" font-size="13.5" font-weight="700">LAYER 1: INPUT TENSOR &amp; FEATURE EXTRACTION</text>

    <!-- Raw Payload Representation -->
    <rect x="20" y="55" width="340" height="125" rx="8" fill="url(#m-grad-blue)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="35" y="80" fill="#60a5fa" font-size="13" font-weight="600">Raw Email Payload (Tuple Domain)</text>
    <text x="35" y="102" fill="#cbd5e1" font-size="11">Input: e = ⟨Subject, Body, Sender, Domain, ReceivedAt, Links⟩</text>
    <text x="35" y="120" fill="#94a3b8" font-size="10.5">• Subject: Character sequence S ∈ Σ*, |S| ≤ 256</text>
    <text x="35" y="136" fill="#94a3b8" font-size="10.5">• Body: Unstructured string B ∈ Σ*, |B| ≤ 50,000</text>
    <text x="35" y="152" fill="#94a3b8" font-size="10.5">• Sender &amp; Domain: Normalized RFC 5322 identifier</text>
    <text x="35" y="168" fill="#34d399" font-size="10.5" font-weight="600">Tensor Shape: Non-vectorized heterogeneous payload</text>

    <!-- Synthetic Feature String -->
    <rect x="20" y="200" width="340" height="145" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="35" y="225" fill="#f1f5f9" font-size="13" font-weight="600">Normalized Feature Synthesis</text>
    <text x="35" y="247" fill="#cbd5e1" font-size="11">Function: build_feature_text(S, B, E, D)</text>
    <text x="35" y="267" fill="#94a3b8" font-size="10.5">t = "subject: " ∥ S ∥ " sender: " ∥ E ∥</text>
    <text x="45" y="283" fill="#94a3b8" font-size="10.5">" domain: " ∥ D ∥ " body: " ∥ B</text>
    <text x="35" y="303" fill="#94a3b8" font-size="10.5">• Lowercasing, regex entity collapse, whitespace strip</text>
    <text x="35" y="321" fill="#94a3b8" font-size="10.5">• Domain marker isolation preserves institutional signal</text>
    <text x="35" y="337" fill="#34d399" font-size="10.5" font-weight="600">Output Shape: Normalized string t ∈ Σ*</text>

    <!-- Downward arrow -->
    <path d="M 190 180 L 190 200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m-arrow)"/>
    <path d="M 190 345 L 190 365" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m-arrow)"/>

    <!-- Sublinear TF-IDF Vectorizer -->
    <rect x="20" y="365" width="340" height="190" rx="8" fill="url(#m-grad-cyan)" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="35" y="390" fill="#67e8f9" font-size="13" font-weight="600">Sublinear TF-IDF Vectorizer</text>
    <text x="35" y="412" fill="#cbd5e1" font-size="11">Parameters: ngram_range=(1, 2), sublinear_tf=True</text>
    <text x="35" y="432" fill="#94a3b8" font-size="10.5">Term Frequency: tf'(t, d) = 1 + log(tf(t, d)) for tf &gt; 0</text>
    <text x="35" y="450" fill="#94a3b8" font-size="10.5">Inverse Doc Freq: idf(t) = log[(1 + N) / (1 + df(t))] + 1</text>
    <text x="35" y="468" fill="#94a3b8" font-size="10.5">L2-Normalized: x_i = tf-idf(t, d) / ||tf-idf(·, d)||_2</text>
    <text x="35" y="492" fill="#e2e8f0" font-size="11" font-weight="600">Vocabulary Size: |V| = D ∈ [5,000, 20,000]</text>
    <text x="35" y="512" fill="#94a3b8" font-size="10.5">• Unigram + Bigram feature capture (e.g., "last date")</text>
    <text x="35" y="534" fill="#34d399" font-size="11" font-weight="700">Tensor Output Shape: x ∈ ℝ^(1 × D) [Sparse Float32]</text>

    <!-- Deterministic Fast Rules -->
    <rect x="20" y="575" width="340" height="205" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="35" y="600" fill="#f1f5f9" font-size="13" font-weight="600">Deterministic Fast Gate (Layer 1)</text>
    <text x="35" y="622" fill="#cbd5e1" font-size="11">Rule Evaluation Matrix (Zero-latency scan)</text>
    <text x="35" y="642" fill="#94a3b8" font-size="10.5">• Whitelist Sender Scan: s ∈ Important_Senders</text>
    <text x="35" y="660" fill="#94a3b8" font-size="10.5">• Academic Circular Check: sender = *@college.edu</text>
    <text x="35" y="678" fill="#94a3b8" font-size="10.5">• Strict Security Filter: Phishing regex / SPF fail</text>
    <text x="35" y="698" fill="#fbbf24" font-size="10.5" font-weight="600">Decision Branch: If conf_det ≥ 0.85 ➔ Direct Accept</text>
    <text x="35" y="716" fill="#fbbf24" font-size="10.5" font-weight="600">Else ➔ Escalate to Local ML Model (Novelty A)</text>
    <text x="35" y="742" fill="#94a3b8" font-size="10">Guarantees zero false-positive spam on institutional emails</text>
  </g>

  <!-- Arrow between Column 1 and Column 2 -->
  <path d="M 420 460 L 460 460" stroke="#38bdf8" stroke-width="2" marker-end="url(#m-arrow-cyan)"/>

  <!-- ==================== MIDDLE COLUMN: NOVELTY A - CASCADED PROBABILISTIC CLASSIFIER ==================== -->
  <g transform="translate(460, 105)">
    <rect width="480" height="800" rx="12" fill="#1c2541" stroke="#334155" stroke-width="1.5"/>
    <rect width="480" height="40" rx="12" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="240" y="25" text-anchor="middle" fill="#fbbf24" font-size="13.5" font-weight="700">LAYER 1.5: PROPOSED NOVELTY A — CASCADED INFERENCE GATE</text>

    <!-- Calibrated Logistic Regression Model -->
    <rect x="20" y="55" width="440" height="235" rx="10" fill="url(#m-grad-novelty)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="30" y="65" width="160" height="24" rx="4" fill="#b45309"/>
    <text x="110" y="81" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">PROPOSED NOVELTY A</text>

    <text x="35" y="112" fill="#fef3c7" font-size="14" font-weight="700">Calibrated Multi-Class Softmax Classifier</text>
    <text x="35" y="132" fill="#fde68a" font-size="11.5">Equation: z = W · x + b, where W ∈ ℝ^(K × D), b ∈ ℝ^K, K = 15</text>
    <text x="35" y="152" fill="#f8fafc" font-size="11">Posterior Distribution: P(Y = c_k | x) = exp(z_k) / ∑_{j=1}^K exp(z_j)</text>

    <text x="35" y="177" fill="#cbd5e1" font-size="11" font-weight="600">Design Choice Justification &amp; Regularization:</text>
    <text x="35" y="195" fill="#e2e8f0" font-size="10.5">• High inverse regularizer C = 30.0 (sharpens posterior probabilities over</text>
    <text x="45" y="211" fill="#e2e8f0" font-size="10.5">sparse feature spaces, counteracting probability flattening in 15 classes)</text>
    <text x="35" y="229" fill="#e2e8f0" font-size="10.5">• Balanced Class Weights: w_k = N / (K · N_k) prevents majority class bias</text>
    <text x="35" y="252" fill="#34d399" font-size="11" font-weight="700">Layer Tensor Shapes: W ∈ ℝ^(15 × D), b ∈ ℝ^15, y_hat ∈ [0, 1]^15</text>
    <text x="35" y="272" fill="#93c5fd" font-size="10.5">Inference Latency: &lt; 3.2 ms on CPU | Zero GPU requirement</text>

    <!-- Probability Thresholding & Gating Engine -->
    <rect x="20" y="305" width="440" height="200" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="330" fill="#38bdf8" font-size="13.5" font-weight="700">Probabilistic Confidence Gating Mechanism</text>
    <text x="35" y="352" fill="#cbd5e1" font-size="11">Maximum Posterior Probability: P_max = max_{k} P(Y = c_k | x)</text>
    <text x="35" y="372" fill="#f8fafc" font-size="11">Threshold Condition: P_max ≥ τ (Default τ = 0.70)</text>

    <!-- Branching Box -->
    <rect x="35" y="390" width="190" height="95" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="45" y="410" fill="#93c5fd" font-size="11" font-weight="700">CONFIDENT (P_max ≥ 0.70)</text>
    <text x="45" y="428" fill="#e2e8f0" font-size="10">• Accept Local ML Label</text>
    <text x="45" y="444" fill="#e2e8f0" font-size="10">• Skip LLM completely</text>
    <text x="45" y="460" fill="#34d399" font-size="10.5" font-weight="600">↳ 68.4% of all emails</text>
    <text x="45" y="474" fill="#38bdf8" font-size="9.5">Cost: $0.00 | Latency: 3ms</text>

    <rect x="245" y="390" width="200" height="95" rx="6" fill="#4c0519" stroke="#fb7185" stroke-width="1"/>
    <text x="255" y="410" fill="#fda4af" font-size="11" font-weight="700">UNCERTAIN (P_max &lt; 0.70)</text>
    <text x="255" y="428" fill="#e2e8f0" font-size="10">• Escalate to Layer 2 (LLM)</text>
    <text x="255" y="444" fill="#e2e8f0" font-size="10">• Ambiguity / Conflict</text>
    <text x="255" y="460" fill="#fbbf24" font-size="10.5" font-weight="600">↳ 31.6% escalated</text>
    <text x="255" y="474" fill="#cbd5e1" font-size="9.5">Preserves frontier accuracy</text>

    <!-- Downward arrow -->
    <path d="M 240 290 L 240 305" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m-arrow)"/>
    <path d="M 345 485 L 345 520" stroke="#fb7185" stroke-width="1.5" marker-end="url(#m-arrow)"/>

    <!-- Layer 2: LLM Fallback Service -->
    <rect x="20" y="520" width="440" height="135" rx="8" fill="url(#m-grad-rose)" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="35" y="545" fill="#fda4af" font-size="13" font-weight="600">Layer 2: Structured LLM Client (Gemini / Claude / Local LLM)</text>
    <text x="35" y="567" fill="#cbd5e1" font-size="11">Prompt: System instructions + 15-class category constraint + normalized email</text>
    <text x="35" y="585" fill="#94a3b8" font-size="10.5">• Structured Output Validation: JSON Schema enforcement</text>
    <text x="35" y="601" fill="#94a3b8" font-size="10.5">• Output: category, subcategory, importance_estimate, reasoning</text>
    <text x="35" y="619" fill="#94a3b8" font-size="10.5">• Fallback safety: If API timeout ➔ Revert to deterministic precedence</text>
    <text x="35" y="639" fill="#34d399" font-size="10.5" font-weight="600">Output Shape: Categorical Discrete Label c* ∈ TriageCategory</text>

    <!-- Active Learning Feedback Dataset -->
    <rect x="20" y="670" width="440" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="35" y="695" fill="#f1f5f9" font-size="13" font-weight="600">Online Feedback Dataset &amp; Automated Retraining</text>
    <text x="35" y="715" fill="#cbd5e1" font-size="10.5">• User corrections in Flutter client stored in sqlite `feedback_corrections`</text>
    <text x="35" y="733" fill="#cbd5e1" font-size="10.5">• Scheduled offline retrain: triggers upon ≥ 25 verified new corrections</text>
    <text x="35" y="751" fill="#cbd5e1" font-size="10.5">• Model validation check: Refuses promotion if CV accuracy degrades</text>
    <text x="35" y="769" fill="#38bdf8" font-size="10.5">Continuous active learning closed loop</text>
  </g>

  <!-- Arrow between Column 2 and Column 3 -->
  <path d="M 940 460 L 980 460" stroke="#38bdf8" stroke-width="2" marker-end="url(#m-arrow-cyan)"/>

  <!-- ==================== RIGHT COLUMN: NOVELTY B & C — MULTI-AGENT ARBITRATION & PROXIMITY ==================== -->
  <g transform="translate(980, 105)">
    <rect width="380" height="800" rx="12" fill="#1c2541" stroke="#334155" stroke-width="1.5"/>
    <rect width="380" height="40" rx="12" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="190" y="25" text-anchor="middle" fill="#34d399" font-size="13.5" font-weight="700">NOVELTY B &amp; C: ARBITRATION &amp; PROXIMITY</text>

    <!-- Novelty B: Deterministic Multi-Agent Arbitration Matrix -->
    <rect x="20" y="55" width="340" height="260" rx="10" fill="url(#m-grad-emerald)" stroke="#10b981" stroke-width="1.8"/>
    <rect x="30" y="65" width="160" height="24" rx="4" fill="#047857"/>
    <text x="110" y="81" text-anchor="middle" fill="#d1fae5" font-size="11" font-weight="700">PROPOSED NOVELTY B</text>

    <text x="35" y="112" fill="#a7f3d0" font-size="14" font-weight="700">Deterministic Multi-Agent Arbitration</text>
    <text x="35" y="132" fill="#f8fafc" font-size="11" font-weight="600">Cross-Agent Conflict Resolution Matrix</text>

    <text x="35" y="152" fill="#cbd5e1" font-size="10.5">• Rule R_1 (Low Category / High Priority Conflict):</text>
    <text x="45" y="167" fill="#94a3b8" font-size="10">If category ∈ {PROMO, SPAM} ∧ actions ≠ ∅ ➔</text>
    <text x="45" y="181" fill="#fbbf24" font-size="10">Set needs_human_review = TRUE, withhold delete</text>

    <text x="35" y="199" fill="#cbd5e1" font-size="10.5">• Rule R_2 (Temporal Deadline Clamp):</text>
    <text x="45" y="214" fill="#94a3b8" font-size="10">If deadline &lt; 24h ∧ priority = LOW ➔</text>
    <text x="45" y="228" fill="#fbbf24" font-size="10">Clamp priority to HIGH / CRITICAL</text>

    <text x="35" y="246" fill="#cbd5e1" font-size="10.5">• Rule R_3 (Hallucination Barrier):</text>
    <text x="45" y="261" fill="#94a3b8" font-size="10">Regex verified ISO timestamps supersede ungrounded LLM dates</text>
    <text x="35" y="285" fill="#34d399" font-size="10.5" font-weight="600">Guarantees 100% Deterministic Reproducibility</text>
  </g>

  <!-- Novelty C: Continuous Temporal Horizon Proximity Engine -->
  <g transform="translate(1000, 440)">
    <rect width="340" height="235" rx="10" fill="url(#m-grad-purple)" stroke="#8b5cf6" stroke-width="1.8"/>
    <rect x="10" y="10" width="160" height="24" rx="4" fill="#6d28d9"/>
    <text x="90" y="26" text-anchor="middle" fill="#ede9fe" font-size="11" font-weight="700">PROPOSED NOVELTY C</text>

    <text x="15" y="56" fill="#c4b5fd" font-size="14" font-weight="700">Temporal Horizon Proximity Engine</text>
    <text x="15" y="76" fill="#cbd5e1" font-size="11">Continuous Metric: Δt = T_due - T_current (UTC)</text>

    <text x="15" y="98" fill="#f8fafc" font-size="10.5" font-weight="600">Discrete Escalation State Transition:</text>
    <text x="15" y="116" fill="#cbd5e1" font-size="10">• Δt &gt; 7 days ➔ NORMAL (Inbox feed badge)</text>
    <text x="15" y="132" fill="#cbd5e1" font-size="10">• 24h &lt; Δt ≤ 7d ➔ REMINDER (Quiet push)</text>
    <text x="15" y="148" fill="#f59e0b" font-size="10">• 1h &lt; Δt ≤ 24h ➔ URGENT (High-priority push)</text>
    <text x="15" y="164" fill="#f43f5e" font-size="10">• Δt ≤ 1h / OVERDUE ➔ ALARM (Modal sound dialog)</text>

    <text x="15" y="190" fill="#fbbf24" font-size="10.5" font-weight="600">Priority Scoring Equation:</text>
    <text x="15" y="208" fill="#e2e8f0" font-size="10">S = 0.35·W_band + 0.25·W_sender + 0.25·W_prox + 0.15·W_act</text>
    <text x="15" y="224" fill="#34d399" font-size="10" font-weight="700">Mapped to: LOW [0-39] | MED [40-69] | HIGH [70-84] | CRIT [85-100]</text>
  </g>

  <!-- Final Output State Box in Right Column -->
  <g transform="translate(1000, 690)">
    <rect width="340" height="195" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="15" y="25" fill="#f8fafc" font-size="13" font-weight="600">Final Evaluated Decision Tuple</text>
    <text x="15" y="47" fill="#38bdf8" font-size="11">y_final = ⟨c*, S, A, D, flags, τ_audit⟩</text>
    <text x="15" y="69" fill="#94a3b8" font-size="10.5">• c* ∈ {INTERNSHIP, PLACEMENT, EXAM, ASSIGNMENT, ...}</text>
    <text x="15" y="87" fill="#94a3b8" font-size="10.5">• S ∈ [0, 100] (Continuous Priority Metric)</text>
    <text x="15" y="105" fill="#94a3b8" font-size="10.5">• A = {a_1, ..., a_m}: Canonical imperative actions</text>
    <text x="15" y="123" fill="#94a3b8" font-size="10.5">• D = {d_1, ..., d_n}: ISO-8601 UTC temporal timestamps</text>
    <text x="15" y="141" fill="#94a3b8" font-size="10.5">• flags = ⟨store=T, notify=T, monitor=T, review=F⟩</text>
    <text x="15" y="159" fill="#34d399" font-size="10.5" font-weight="600">Zero Hallucination Guarantee via Deterministic Audit Log</text>
  </g>

  <!-- Footer Info -->
  <text x="700" y="930" text-anchor="middle" fill="#64748b" font-size="11">Course Mini Project — DA1 Model &amp; Novelty Architecture | Tensor Flow &amp; Inference Math | AGENT AMAR</text>
</svg>

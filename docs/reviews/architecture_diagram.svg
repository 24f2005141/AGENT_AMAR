<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" style="background:#0f172a; font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="700" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="1">AGENT AMAR: END-TO-END SYSTEM PIPELINE ARCHITECTURE</text>
  <text x="700" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Autonomous Multi-Agent Email Triage, Action Extraction, Temporal Proximity Scoring &amp; Escalated Push Delivery</text>

  <!-- ==================== STAGE 1: DATA ACQUISITION & PREPROCESSING ==================== -->
  <g transform="translate(40, 100)">
    <!-- Stage Container -->
    <rect width="250" height="740" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="250" height="42" rx="14" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="125" y="26" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600">1. INGESTION &amp; NORMALIZATION</text>

    <!-- Sub-boxes -->
    <!-- Gmail API & OAuth -->
    <rect x="20" y="65" width="210" height="95" rx="8" fill="url(#grad-blue)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="30" y="90" fill="#60a5fa" font-size="13" font-weight="600">Google OAuth 2.0</text>
    <text x="30" y="110" fill="#cbd5e1" font-size="11">• Per-user isolated token vault</text>
    <text x="30" y="126" fill="#cbd5e1" font-size="11">• Incremental Gmail History API</text>
    <text x="30" y="142" fill="#cbd5e1" font-size="11">• State tracking: last_history_id</text>

    <!-- Raw Mail Intake -->
    <rect x="20" y="185" width="210" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="30" y="210" fill="#f1f5f9" font-size="13" font-weight="600">Mail Intake Agent</text>
    <text x="30" y="230" fill="#94a3b8" font-size="11">• Deterministic RFC 2822 parser</text>
    <text x="30" y="248" fill="#94a3b8" font-size="11">• HTML-to-text sanitization</text>
    <text x="30" y="266" fill="#94a3b8" font-size="11">• Whitespace &amp; entity collapse</text>
    <text x="30" y="284" fill="#94a3b8" font-size="11">• Sensitive secret minimizer</text>
    <text x="30" y="302" fill="#94a3b8" font-size="11">• Unicode normalization (NFKC)</text>
    <text x="30" y="320" fill="#94a3b8" font-size="11">• Sender domain isolation</text>

    <!-- Pydantic Model -->
    <rect x="20" y="360" width="210" height="90" rx="8" fill="url(#grad-emerald)" stroke="#10b981" stroke-width="1.2"/>
    <text x="30" y="385" fill="#34d399" font-size="13" font-weight="600">NormalizedEmail (Pydantic)</text>
    <text x="30" y="405" fill="#cbd5e1" font-size="11">• email_id, thread_id, subject</text>
    <text x="30" y="423" fill="#cbd5e1" font-size="11">• cleaned_body, sender_domain</text>
    <text x="30" y="441" fill="#cbd5e1" font-size="11">• received_at (UTC), links, files</text>

    <!-- Audit & Security Pre-check -->
    <rect x="20" y="475" width="210" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="30" y="500" fill="#f1f5f9" font-size="13" font-weight="600">Security Pre-Filter</text>
    <text x="30" y="520" fill="#94a3b8" font-size="11">• Zero plaintext credentials saved</text>
    <text x="30" y="538" fill="#94a3b8" font-size="11">• OTP &amp; auth token redaction</text>
    <text x="30" y="556" fill="#94a3b8" font-size="11">• College domain validation</text>
    <text x="30" y="574" fill="#94a3b8" font-size="11">• Phishing heuristic flags</text>

    <!-- Stage Output Connector -->
    <path d="M 125 160 L 125 185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 125 335 L 125 360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 125 450 L 125 475" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrow between Stage 1 and Stage 2 -->
  <path d="M 290 410 L 330 410" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== STAGE 2: MULTI-AGENT INTELLIGENCE PIPELINE ==================== -->
  <g transform="translate(330, 100)">
    <rect width="400" height="740" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="400" height="42" rx="14" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="200" y="26" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="600">2. MULTI-AGENT INTELLIGENCE PIPELINE</text>

    <!-- Agent 1: Triage Agent (Cascaded Novelty) -->
    <rect x="20" y="60" width="360" height="180" rx="10" fill="url(#grad-purple)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="35" y="85" fill="#c4b5fd" font-size="14" font-weight="700">Triage Agent (Cascaded Hybrid)</text>
    <text x="35" y="103" fill="#e2e8f0" font-size="11" font-weight="600">Layer 1: Deterministic Keyword &amp; Domain Precedence</text>
    <text x="45" y="120" fill="#cbd5e1" font-size="10.5">• High-confidence academic/spam rule matches</text>

    <text x="35" y="140" fill="#38bdf8" font-size="11" font-weight="600">Layer 1.5: Local ML Classifier [PROPOSED NOVELTY]</text>
    <text x="45" y="157" fill="#cbd5e1" font-size="10.5">• TF-IDF (1-2 grams) + Calibrated Logistic Regression (C=30.0)</text>
    <text x="45" y="172" fill="#cbd5e1" font-size="10.5">• Fast probability threshold gating (τ ≥ 0.70) (Latency &lt; 5 ms)</text>

    <text x="35" y="195" fill="#f43f5e" font-size="11" font-weight="600">Layer 2: LLM Fallback (Gemini / Claude / Local LLM)</text>
    <text x="45" y="212" fill="#cbd5e1" font-size="10.5">• Escalated ONLY for ambiguous or conflicting cases (Reduces 65% cost)</text>
    <text x="45" y="227" fill="#cbd5e1" font-size="10.5">• Output: 15-class category label + confidence estimate</text>

    <!-- Agent 2: Action Agent -->
    <rect x="20" y="255" width="170" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="30" y="280" fill="#f1f5f9" font-size="13" font-weight="600">Action Agent</text>
    <text x="30" y="300" fill="#94a3b8" font-size="10.5">• Conditional gate (Triage)</text>
    <text x="30" y="316" fill="#94a3b8" font-size="10.5">• Imperative verb extraction</text>
    <text x="30" y="332" fill="#94a3b8" font-size="10.5">• Task canonicalization</text>
    <text x="30" y="348" fill="#94a3b8" font-size="10.5">• Form / link identification</text>
    <text x="30" y="364" fill="#94a3b8" font-size="10.5">• Structured Action JSON</text>
    <text x="30" y="380" fill="#94a3b8" font-size="10.5">• LLM semantic backup</text>

    <!-- Agent 3: Deadline Agent -->
    <rect x="210" y="255" width="170" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="220" y="280" fill="#f1f5f9" font-size="13" font-weight="600">Deadline Agent</text>
    <text x="220" y="300" fill="#94a3b8" font-size="10.5">• Conditional gate (Action)</text>
    <text x="220" y="316" fill="#94a3b8" font-size="10.5">• Multi-format regex parser</text>
    <text x="220" y="332" fill="#94a3b8" font-size="10.5">• Relative date anchoring</text>
    <text x="220" y="348" fill="#94a3b8" font-size="10.5">• ISO-8601 UTC timestamp</text>
    <text x="220" y="364" fill="#94a3b8" font-size="10.5">• Fuzzy context resolver</text>
    <text x="220" y="380" fill="#94a3b8" font-size="10.5">• Temporal confidence score</text>

    <!-- Agent 4: Priority Agent -->
    <rect x="20" y="425" width="360" height="120" rx="8" fill="url(#grad-amber)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="35" y="450" fill="#fbbf24" font-size="13" font-weight="600">Priority Agent (Dynamic Context Engine)</text>
    <text x="35" y="470" fill="#cbd5e1" font-size="10.5">• Multi-Factor Priority Scoring Equation: S = f(Category, Sender, Proximity, Actions)</text>
    <text x="35" y="488" fill="#cbd5e1" font-size="10.5">• Sender reputation lookup (Important Senders whitelist &amp; domain weight)</text>
    <text x="35" y="506" fill="#cbd5e1" font-size="10.5">• Continuous Proximity Bucketing: OVERDUE | WITHIN_1H | WITHIN_24H | WITHIN_7D</text>
    <text x="35" y="524" fill="#cbd5e1" font-size="10.5">• Output: Continuous score (0–100) mapped to {LOW, MEDIUM, HIGH, CRITICAL}</text>

    <!-- Inner Agent connectors -->
    <path d="M 105 240 L 105 255" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 295 240 L 295 255" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 105 405 L 105 425" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 295 405 L 295 425" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Agent Trace Box -->
    <rect x="20" y="565" width="360" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="35" y="590" fill="#f8fafc" font-size="13" font-weight="600">Structured Agent Trace &amp; Audit Log</text>
    <text x="35" y="612" fill="#94a3b8" font-size="11">• Per-agent execution timestamp &amp; duration tracking</text>
    <text x="35" y="632" fill="#94a3b8" font-size="11">• Raw reasoning outputs, confidence metrics, and flags</text>
    <text x="35" y="652" fill="#94a3b8" font-size="11">• Explanatory human review reasons (needs_human_review)</text>
    <text x="35" y="672" fill="#94a3b8" font-size="11">• Full deterministic reproducibility across all pipeline runs</text>
  </g>

  <!-- Arrow between Stage 2 and Stage 3 -->
  <path d="M 730 410 L 770 410" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== STAGE 3: DETERMINISTIC ARBITRATION & ORCHESTRATION ==================== -->
  <g transform="translate(770, 100)">
    <rect width="280" height="740" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="280" height="42" rx="14" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="140" y="26" text-anchor="middle" fill="#34d399" font-size="14" font-weight="600">3. ORCHESTRATION &amp; ARBITRATION</text>

    <!-- AMAR Orchestrator -->
    <rect x="15" y="60" width="250" height="230" rx="8" fill="url(#grad-emerald)" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="85" fill="#6ee7b7" font-size="14" font-weight="700">AMAR Orchestrator</text>
    <text x="25" y="105" fill="#f8fafc" font-size="11.5" font-weight="600">Deterministic Conflict Resolution</text>
    <text x="25" y="125" fill="#cbd5e1" font-size="10.5">• Rule 1: High Priority + Low Band</text>
    <text x="35" y="140" fill="#94a3b8" font-size="10">↳ Force human review if action/due</text>
    <text x="25" y="158" fill="#cbd5e1" font-size="10.5">• Rule 2: Near Deadline + Low Priority</text>
    <text x="35" y="173" fill="#94a3b8" font-size="10">↳ Clamp priority to HIGH / CRITICAL</text>
    <text x="25" y="191" fill="#cbd5e1" font-size="10.5">• Rule 3: Conflicting Agent Dates</text>
    <text x="35" y="206" fill="#94a3b8" font-size="10">↳ Deduplicate &amp; prioritize nearest date</text>
    <text x="25" y="224" fill="#cbd5e1" font-size="10.5">• Rule 4: Critical Domain Override</text>
    <text x="35" y="239" fill="#94a3b8" font-size="10">↳ @college.edu never marked SPAM</text>
    <text x="25" y="257" fill="#cbd5e1" font-size="10.5">• Rule 5: Low Confidence Fallback</text>
    <text x="35" y="272" fill="#94a3b8" font-size="10">↳ Trigger needs_human_review flag</text>

    <!-- Final Decision Tuple -->
    <rect x="15" y="310" width="250" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="25" y="335" fill="#38bdf8" font-size="13" font-weight="600">Final Decision Object</text>
    <text x="25" y="355" fill="#f1f5f9" font-size="11">• primary_category: TriageCategory</text>
    <text x="25" y="373" fill="#f1f5f9" font-size="11">• priority_score: 0–100 [BAND]</text>
    <text x="25" y="391" fill="#f1f5f9" font-size="11">• actions: list[DecisionAction]</text>
    <text x="25" y="409" fill="#f1f5f9" font-size="11">• deadlines: list[DecisionDeadline]</text>
    <text x="25" y="427" fill="#f1f5f9" font-size="11">• routing: store, notify, monitor</text>
    <text x="25" y="445" fill="#f1f5f9" font-size="11">• folder_label: "AMAR/..."</text>

    <!-- Cryptographic Storage -->
    <rect x="15" y="480" width="250" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="25" y="505" fill="#f1f5f9" font-size="13" font-weight="600">Transparent Cryptographic Store</text>
    <text x="25" y="525" fill="#94a3b8" font-size="10.5">• AES-256-GCM field encryption</text>
    <text x="25" y="541" fill="#94a3b8" font-size="10.5">• PII &amp; email body ciphertext in DB</text>
    <text x="25" y="557" fill="#94a3b8" font-size="10.5">• SHA-256 tamper-evident ledger</text>
    <text x="25" y="573" fill="#94a3b8" font-size="10.5">• Multi-user schema isolation</text>

    <!-- Connectors -->
    <path d="M 140 290 L 140 310" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 140 460 L 140 480" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Backend Database -->
    <rect x="15" y="610" width="250" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="635" fill="#cbd5e1" font-size="12" font-weight="600">SQLite / PostgreSQL Schema</text>
    <text x="25" y="655" fill="#94a3b8" font-size="10">• emails, actions, deadlines</text>
    <text x="25" y="672" fill="#94a3b8" font-size="10">• reminders, notifications, audit_log</text>
    <text x="25" y="689" fill="#94a3b8" font-size="10">• device_registrations (FCM)</text>
  </g>

  <!-- Arrow between Stage 3 and Stage 4 -->
  <path d="M 1050 410 L 1090 410" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== STAGE 4: MONITORING, ESCALATION & DELIVERY ==================== -->
  <g transform="translate(1090, 100)">
    <rect width="270" height="740" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="42" rx="14" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="135" y="26" text-anchor="middle" fill="#f43f5e" font-size="14" font-weight="600">4. MONITORING &amp; DELIVERY</text>

    <!-- Monitor Scheduler -->
    <rect x="15" y="60" width="240" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="25" y="85" fill="#f1f5f9" font-size="13" font-weight="600">MonitorScheduler (Async)</text>
    <text x="25" y="105" fill="#94a3b8" font-size="10.5">• Loop 1: Gmail Sync (30s interval)</text>
    <text x="25" y="123" fill="#94a3b8" font-size="10.5">• Loop 2: Deadline Proximity (60s)</text>
    <text x="25" y="141" fill="#94a3b8" font-size="10.5">• Loop 3: Reminders Firing (30s)</text>
    <text x="25" y="159" fill="#94a3b8" font-size="10.5">• Escalation: NORMAL → REMINDER</text>
    <text x="35" y="175" fill="#f43f5e" font-size="10">↳ → URGENT → ALARM</text>
    <text x="25" y="193" fill="#94a3b8" font-size="10.5">• Idempotent deduplication</text>

    <!-- FCM Push Notification Service -->
    <rect x="15" y="230" width="240" height="130" rx="8" fill="url(#grad-rose)" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="25" y="255" fill="#fda4af" font-size="13" font-weight="600">Push Notification Service</text>
    <text x="25" y="275" fill="#cbd5e1" font-size="10.5">• Firebase Cloud Messaging (FCM)</text>
    <text x="25" y="293" fill="#cbd5e1" font-size="10.5">• Delivers to terminated app state</text>
    <text x="25" y="311" fill="#cbd5e1" font-size="10.5">• Payload: IDs only (Zero PII leakage)</text>
    <text x="25" y="329" fill="#cbd5e1" font-size="10.5">• Multi-device token fanout</text>
    <text x="25" y="347" fill="#cbd5e1" font-size="10.5">• dispatched_at state tracking</text>

    <!-- FastAPI REST Gateway -->
    <rect x="15" y="380" width="240" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="25" y="405" fill="#38bdf8" font-size="13" font-weight="600">FastAPI Application Gateway</text>
    <text x="25" y="425" fill="#94a3b8" font-size="10.5">• Bearer token authentication</text>
    <text x="25" y="443" fill="#94a3b8" font-size="10.5">• Endpoints: /api/v1/emails/...</text>
    <text x="25" y="461" fill="#94a3b8" font-size="10.5">• /deadlines, /reminders, /monitor</text>
    <text x="25" y="479" fill="#94a3b8" font-size="10.5">• Strict Pydantic frozen contract</text>

    <!-- Flutter Cross-Platform Client -->
    <rect x="15" y="510" width="240" height="205" rx="8" fill="url(#grad-blue)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="25" y="535" fill="#93c5fd" font-size="14" font-weight="700">Flutter Mobile / Desktop App</text>
    <text x="25" y="555" fill="#f8fafc" font-size="11" font-weight="600">Intelligent User Interface</text>
    <text x="25" y="575" fill="#cbd5e1" font-size="10.5">• Home Inbox: Filtered triage feed</text>
    <text x="25" y="593" fill="#cbd5e1" font-size="10.5">• Deadlines Screen: Proximity ladder</text>
    <text x="25" y="611" fill="#cbd5e1" font-size="10.5">• Needs Attention: Low-conf review</text>
    <text x="25" y="629" fill="#cbd5e1" font-size="10.5">• Reminders: Snooze, complete, add</text>
    <text x="25" y="647" fill="#cbd5e1" font-size="10.5">• Local Notifications &amp; Sound</text>
    <text x="25" y="665" fill="#cbd5e1" font-size="10.5">• Modal Alarm Dialog (Urgent events)</text>
    <text x="25" y="683" fill="#cbd5e1" font-size="10.5">• Live SQLite active feedback loop</text>

    <!-- Connectors -->
    <path d="M 135 210 L 135 230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 135 360 L 135 380" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 135 490 L 135 510" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Footer Info -->
  <text x="700" y="875" text-anchor="middle" fill="#64748b" font-size="11">Course Mini Project — Review 1 (DA1) System Architecture | Source Code: https://github.com/24f2005141/AGENT_AMAR</text>
</svg>

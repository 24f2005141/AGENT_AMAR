<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" style="background:#090d16; font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="seq-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="seq-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="seq-grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="seq-grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="seq-grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="seq-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="seq-arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="700" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.8">AGENT AMAR: END-TO-END DATA FLOW &amp; PROCESSING PIPELINE</text>
  <text x="700" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Detailed Functional Architecture: Gmail Sync &rarr; Multi-Agent Intelligence &rarr; Cryptographic Store &rarr; Flutter UI</text>

  <!-- ==================== ACTORS / SWIMLANES (COLUMNS) ==================== -->
  <!-- Column 1: External Services -->
  <rect x="40" y="95" width="220" height="820" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="40" y="95" width="220" height="40" rx="10" fill="#1f2937"/>
  <text x="150" y="120" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1. INGESTION &amp; SYNC</text>

  <!-- Column 2: Multi-Agent Intelligence Core -->
  <rect x="280" y="95" width="370" height="820" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="280" y="95" width="370" height="40" rx="10" fill="#1f2937"/>
  <text x="465" y="120" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="700">2. MULTI-AGENT INTELLIGENCE PIPELINE</text>

  <!-- Column 3: Orchestrator & Persistence -->
  <rect x="670" y="95" width="340" height="820" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="670" y="95" width="340" height="40" rx="10" fill="#1f2937"/>
  <text x="840" y="120" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">3. ARBITRATION &amp; ENCRYPTION</text>

  <!-- Column 4: Background Service & Client Delivery -->
  <rect x="1030" y="95" width="330" height="820" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="1030" y="95" width="330" height="40" rx="10" fill="#1f2937"/>
  <text x="1195" y="120" text-anchor="middle" fill="#f43f5e" font-size="13" font-weight="700">4. MONITORING &amp; DELIVERY</text>

  <!-- ==================== COLUMN 1 DETAILS ==================== -->
  <!-- Gmail OAuth -->
  <rect x="55" y="155" width="190" height="100" rx="8" fill="url(#seq-grad-blue)" stroke="#3b82f6" stroke-width="1"/>
  <text x="65" y="180" fill="#60a5fa" font-size="12" font-weight="600">Gmail OAuth 2.0</text>
  <text x="65" y="200" fill="#cbd5e1" font-size="10.5">• Bearer authentication</text>
  <text x="65" y="216" fill="#cbd5e1" font-size="10.5">• Isolated per-user tokens</text>
  <text x="65" y="232" fill="#cbd5e1" font-size="10.5">• Read-only scopes (Security)</text>

  <!-- Gmail History API -->
  <rect x="55" y="275" width="190" height="120" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="65" y="300" fill="#f8fafc" font-size="12" font-weight="600">GmailSyncService</text>
  <text x="65" y="320" fill="#94a3b8" font-size="10.5">• Baseline: mailbox historyId</text>
  <text x="65" y="336" fill="#94a3b8" font-size="10.5">• Incremental delta query</text>
  <text x="65" y="352" fill="#94a3b8" font-size="10.5">• Skips historical archive</text>
  <text x="65" y="368" fill="#94a3b8" font-size="10.5">• Auto-rebaselines on 404</text>
  <text x="65" y="384" fill="#38bdf8" font-size="10.5">Payload: Raw RFC 2822</text>

  <!-- Mail Intake Agent -->
  <rect x="55" y="415" width="190" height="175" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="65" y="440" fill="#f8fafc" font-size="12" font-weight="600">Mail Intake Agent</text>
  <text x="65" y="460" fill="#94a3b8" font-size="10.5">• HTML entity stripping</text>
  <text x="65" y="476" fill="#94a3b8" font-size="10.5">• Whitespace collapse</text>
  <text x="65" y="492" fill="#94a3b8" font-size="10.5">• NFKC Unicode norm</text>
  <text x="65" y="508" fill="#94a3b8" font-size="10.5">• Secret/OTP redaction</text>
  <text x="65" y="524" fill="#94a3b8" font-size="10.5">• Domain isolation (@...)</text>
  <text x="65" y="540" fill="#94a3b8" font-size="10.5">• Link &amp; attachment scan</text>
  <text x="65" y="560" fill="#34d399" font-size="10.5" font-weight="600">NormalizedEmail (Pydantic)</text>

  <!-- Pre-filter security -->
  <rect x="55" y="610" width="190" height="135" rx="8" fill="url(#seq-grad-emerald)" stroke="#059669" stroke-width="1"/>
  <text x="65" y="635" fill="#6ee7b7" font-size="12" font-weight="600">Sanitization Barrier</text>
  <text x="65" y="655" fill="#cbd5e1" font-size="10.5">• Zero plaintext credentials</text>
  <text x="65" y="671" fill="#cbd5e1" font-size="10.5">• Phishing heuristics check</text>
  <text x="65" y="687" fill="#cbd5e1" font-size="10.5">• Sender domain trust level</text>
  <text x="65" y="703" fill="#cbd5e1" font-size="10.5">• UTF-8 safe text stream</text>
  <text x="65" y="725" fill="#38bdf8" font-size="10.5" font-weight="600">Dispatches Clean Object &rarr;</text>

  <!-- ==================== COLUMN 2 DETAILS ==================== -->
  <!-- Triage Agent -->
  <rect x="295" y="155" width="340" height="235" rx="8" fill="url(#seq-grad-purple)" stroke="#9333ea" stroke-width="1.2"/>
  <text x="310" y="180" fill="#c084fc" font-size="13" font-weight="700">Triage Agent (Cascaded Novelty A)</text>
  <text x="310" y="200" fill="#f8fafc" font-size="11" font-weight="600">Layer 1: Deterministic Domain &amp; Keyword Rules</text>
  <text x="320" y="216" fill="#cbd5e1" font-size="10">• Scans Important_Senders &amp; Academic circular patterns</text>

  <text x="310" y="238" fill="#38bdf8" font-size="11" font-weight="600">Layer 1.5: Calibrated TF-IDF + Logistic Regression (C=30)</text>
  <text x="320" y="254" fill="#cbd5e1" font-size="10">• Sparse n-gram vector x &isin; ℝ^D, D &approx; 10,000</text>
  <text x="320" y="270" fill="#cbd5e1" font-size="10">• Softmax logits: z = W&middot;x + b over 15 classes</text>
  <text x="320" y="286" fill="#cbd5e1" font-size="10">• Threshold Gate: P_max &ge; 0.70 &rarr; Accept Local ML (3 ms)</text>

  <text x="310" y="308" fill="#f43f5e" font-size="11" font-weight="600">Layer 2: Structured LLM Fallback (Gemini / Claude / Local)</text>
  <text x="320" y="324" fill="#cbd5e1" font-size="10">• Invoked ONLY when P_max &lt; 0.70 or signals conflict</text>
  <text x="320" y="340" fill="#cbd5e1" font-size="10">• 77.6% of emails handled locally (Avoids LLM API costs)</text>
  <text x="310" y="365" fill="#34d399" font-size="11" font-weight="600">Output: TriageCategory &isin; {INTERNSHIP, EXAM, ...}</text>

  <!-- Action Agent -->
  <rect x="295" y="405" width="160" height="175" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="305" y="430" fill="#f8fafc" font-size="12" font-weight="600">Action Agent</text>
  <text x="305" y="450" fill="#94a3b8" font-size="10">• Gated by Triage</text>
  <text x="305" y="466" fill="#94a3b8" font-size="10">• Imperative verb scan</text>
  <text x="305" y="482" fill="#94a3b8" font-size="10">• Task canonicalization</text>
  <text x="305" y="498" fill="#94a3b8" font-size="10">• Form &amp; URL mapping</text>
  <text x="305" y="514" fill="#94a3b8" font-size="10">• Structured Action JSON</text>
  <text x="305" y="530" fill="#94a3b8" font-size="10">• LLM backup on failure</text>
  <text x="305" y="555" fill="#38bdf8" font-size="10" font-weight="600">A = {a_1, ..., a_m}</text>

  <!-- Deadline Agent -->
  <rect x="475" y="405" width="160" height="175" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="485" y="430" fill="#f8fafc" font-size="12" font-weight="600">Deadline Agent</text>
  <text x="485" y="450" fill="#94a3b8" font-size="10">• Triggered on task/date</text>
  <text x="485" y="466" fill="#94a3b8" font-size="10">• Multi-format regex</text>
  <text x="485" y="482" fill="#94a3b8" font-size="10">• Relative date resolver</text>
  <text x="485" y="498" fill="#94a3b8" font-size="10">• Anchors to received_at</text>
  <text x="485" y="514" fill="#94a3b8" font-size="10">• ISO-8601 UTC string</text>
  <text x="485" y="530" fill="#94a3b8" font-size="10">• Ambiguity flag</text>
  <text x="485" y="555" fill="#38bdf8" font-size="10" font-weight="600">D = {d_1, ..., d_n}</text>

  <!-- Priority Agent -->
  <rect x="295" y="595" width="340" height="165" rx="8" fill="url(#seq-grad-amber)" stroke="#d97706" stroke-width="1.2"/>
  <text x="310" y="620" fill="#fcd34d" font-size="13" font-weight="700">Priority Agent (Context Engine)</text>
  <text x="310" y="640" fill="#cbd5e1" font-size="10.5">Deterministic Scoring Function:</text>
  <text x="320" y="658" fill="#f8fafc" font-size="10.5">S = 0.35&middot;W_band + 0.25&middot;W_sender + 0.25&middot;W_prox + 0.15&middot;W_act</text>
  <text x="310" y="678" fill="#cbd5e1" font-size="10.5">• Proximity: OVERDUE | WITHIN_1H | WITHIN_24H | WITHIN_7D</text>
  <text x="310" y="694" fill="#cbd5e1" font-size="10.5">• Sender Authority: CRITICAL (+30) | HIGH (+15) | LOW_TRUST (-20)</text>
  <text x="310" y="710" fill="#cbd5e1" font-size="10.5">• Category Band: HIGH_VALUE (+25) | LOW_BAND (-30)</text>
  <text x="310" y="735" fill="#34d399" font-size="11" font-weight="600">Level: CRITICAL (90+) | URGENT (75+) | HIGH (55+) | MED | LOW</text>

  <!-- Downward arrows inside Column 2 -->
  <path d="M 375 390 L 375 405" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <path d="M 555 390 L 555 405" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <path d="M 375 580 L 375 595" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <path d="M 555 580 L 555 595" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>

  <!-- Horizontal connector to Column 3 -->
  <path d="M 635 460 L 670 460" stroke="#38bdf8" stroke-width="2" marker-end="url(#seq-arrow-cyan)"/>

  <!-- ==================== COLUMN 3 DETAILS ==================== -->
  <!-- AMAR Orchestrator -->
  <rect x="685" y="155" width="310" height="295" rx="8" fill="url(#seq-grad-emerald)" stroke="#059669" stroke-width="1.5"/>
  <rect x="695" y="165" width="160" height="22" rx="4" fill="#047857"/>
  <text x="775" y="180" text-anchor="middle" fill="#d1fae5" font-size="11" font-weight="700">PROPOSED NOVELTY B</text>

  <text x="695" y="210" fill="#a7f3d0" font-size="14" font-weight="700">AMAR Orchestrator</text>
  <text x="695" y="230" fill="#f8fafc" font-size="11.5" font-weight="600">Deterministic Arbitration Matrix</text>

  <text x="695" y="252" fill="#cbd5e1" font-size="10.5">• Rule R1: Low Category + Actions != &empty; &rarr;</text>
  <text x="705" y="268" fill="#fcd34d" font-size="10">Set needs_human_review=True, prevent auto-archive</text>

  <text x="695" y="288" fill="#cbd5e1" font-size="10.5">• Rule R2: Deadline &lt; 24h + Priority == LOW &rarr;</text>
  <text x="705" y="304" fill="#fcd34d" font-size="10">Clamp Priority to HIGH / CRITICAL</text>

  <text x="695" y="324" fill="#cbd5e1" font-size="10.5">• Rule R3: Institutional Domain Safeguard &rarr;</text>
  <text x="705" y="340" fill="#fcd34d" font-size="10">*@college.edu NEVER labeled SPAM or PROMOTIONAL</text>

  <text x="695" y="360" fill="#cbd5e1" font-size="10.5">• Rule R4: Conflicting Agent Timestamps &rarr;</text>
  <text x="705" y="376" fill="#fcd34d" font-size="10">Deduplicate, select nearest valid future deadline</text>

  <text x="695" y="405" fill="#38bdf8" font-size="11" font-weight="600">Generates: Final Decision Object</text>
  <text x="695" y="423" fill="#cbd5e1" font-size="10.5">Routing Flags: store, notify, monitor, folder_label</text>
  <text x="695" y="439" fill="#94a3b8" font-size="10">Audit Trail: Structured agent_trace</text>

  <!-- AES-256-GCM Cryptographic Storage -->
  <rect x="685" y="465" width="310" height="155" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2"/>
  <text x="695" y="490" fill="#38bdf8" font-size="13" font-weight="600">Transparent Cryptographic Store</text>
  <text x="695" y="510" fill="#cbd5e1" font-size="10.5">• AES-256-GCM field-level encryption at rest</text>
  <text x="695" y="526" fill="#cbd5e1" font-size="10.5">• Encrypted: subject, snippet, body, sender, actions</text>
  <text x="695" y="542" fill="#cbd5e1" font-size="10.5">• Plaintext: IDs, timestamps, categories, priority</text>
  <text x="695" y="558" fill="#cbd5e1" font-size="10.5">• SHA-256 tamper-evident append-only ledger</text>
  <text x="695" y="574" fill="#cbd5e1" font-size="10.5">• Zero-leakage database queries</text>
  <text x="695" y="598" fill="#34d399" font-size="10.5" font-weight="600">Database: SQLite (Dev) / PostgreSQL (Prod)</text>

  <!-- Active Learning Feedback Loop -->
  <rect x="685" y="635" width="310" height="145" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="695" y="660" fill="#f8fafc" font-size="12" font-weight="600">Feedback Dataset &amp; Active Retraining</text>
  <text x="695" y="680" fill="#94a3b8" font-size="10">• User corrections in Flutter &rarr; feedback_corrections</text>
  <text x="695" y="696" fill="#94a3b8" font-size="10">• Offline retraining triggered on &ge; 25 verified records</text>
  <text x="695" y="712" fill="#94a3b8" font-size="10">• Cross-validation accuracy check protects regression</text>
  <text x="695" y="728" fill="#94a3b8" font-size="10">• Atomic model hot-reload in memory</text>
  <text x="695" y="750" fill="#38bdf8" font-size="10.5" font-weight="600">Continuous Human-in-the-Loop Learning</text>

  <!-- Connectors -->
  <path d="M 840 450 L 840 465" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <path d="M 840 620 L 840 635" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <path d="M 995 300 L 1030 300" stroke="#38bdf8" stroke-width="2" marker-end="url(#seq-arrow-cyan)"/>

  <!-- ==================== COLUMN 4 DETAILS ==================== -->
  <!-- Background Monitor Scheduler -->
  <rect x="1045" y="155" width="300" height="190" rx="8" fill="url(#seq-grad-rose)" stroke="#e11d48" stroke-width="1.2"/>
  <rect x="1055" y="165" width="160" height="22" rx="4" fill="#9f1239"/>
  <text x="1135" y="180" text-anchor="middle" fill="#ffe4e6" font-size="11" font-weight="700">PROPOSED NOVELTY C</text>

  <text x="1055" y="210" fill="#fda4af" font-size="13.5" font-weight="700">MonitorScheduler (Async Cron)</text>
  <text x="1055" y="230" fill="#cbd5e1" font-size="10.5">• Gmail Sync Loop: Polling interval = 30s</text>
  <text x="1055" y="246" fill="#cbd5e1" font-size="10.5">• Deadline Check Loop: Interval = 60s</text>
  <text x="1055" y="262" fill="#cbd5e1" font-size="10.5">• Reminder Loop: Polling interval = 30s</text>
  <text x="1055" y="280" fill="#f8fafc" font-size="11" font-weight="600">Continuous Proximity Escalation Ladder:</text>
  <text x="1055" y="298" fill="#fde047" font-size="10.5">NORMAL &rarr; REMINDER &rarr; URGENT &rarr; ALARM</text>
  <text x="1055" y="318" fill="#cbd5e1" font-size="10">• Computes &Delta;t = T_due - T_now</text>
  <text x="1055" y="334" fill="#34d399" font-size="10.5" font-weight="600">Emits PENDING notification rows</text>

  <!-- Push Notification Service -->
  <rect x="1045" y="360" width="300" height="120" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2"/>
  <text x="1055" y="385" fill="#f8fafc" font-size="12" font-weight="600">FCM Push Notification Service</text>
  <text x="1055" y="405" fill="#94a3b8" font-size="10.5">• Firebase Cloud Messaging tokens (per user)</text>
  <text x="1055" y="421" fill="#94a3b8" font-size="10.5">• Wakes terminated mobile background states</text>
  <text x="1055" y="437" fill="#94a3b8" font-size="10.5">• Payload carries IDs ONLY (Zero PII leak)</text>
  <text x="1055" y="453" fill="#94a3b8" font-size="10.5">• Idempotent push tracking (dispatched_at)</text>
  <text x="1055" y="469" fill="#38bdf8" font-size="10.5">Dispatches to iOS / Android / Desktop &rarr;</text>

  <!-- FastAPI REST Gateway -->
  <rect x="1045" y="495" width="300" height="100" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="1055" y="520" fill="#38bdf8" font-size="12" font-weight="600">FastAPI REST Endpoints (/api/v1)</text>
  <text x="1055" y="540" fill="#cbd5e1" font-size="10">• /emails, /deadlines, /reminders, /notifications</text>
  <text x="1055" y="556" fill="#cbd5e1" font-size="10">• Frozen Pydantic Data Transfer Objects (DTOs)</text>
  <text x="1055" y="572" fill="#cbd5e1" font-size="10">• Sub-10 ms REST response latency</text>

  <!-- Flutter Client Application -->
  <rect x="1045" y="610" width="300" height="235" rx="8" fill="url(#seq-grad-blue)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1055" y="635" fill="#93c5fd" font-size="13.5" font-weight="700">Flutter Mobile &amp; Desktop Client</text>
  <text x="1055" y="655" fill="#f8fafc" font-size="11" font-weight="600">Intelligent Attention Interface:</text>
  <text x="1065" y="675" fill="#cbd5e1" font-size="10.5">&bull; Home Inbox: Intelligent categorized feed</text>
  <text x="1065" y="693" fill="#cbd5e1" font-size="10.5">&bull; Deadlines Screen: Visual proximity ladder</text>
  <text x="1065" y="711" fill="#cbd5e1" font-size="10.5">&bull; Needs Attention: Low-confidence human review</text>
  <text x="1065" y="729" fill="#cbd5e1" font-size="10.5">&bull; Reminders: Snooze, complete, custom notes</text>
  <text x="1065" y="747" fill="#cbd5e1" font-size="10.5">&bull; Local Notifications &amp; Sound Alerts</text>
  <text x="1065" y="765" fill="#cbd5e1" font-size="10.5">&bull; Modal Alarm Dialog for CRITICAL deadlines</text>
  <text x="1065" y="785" fill="#fde047" font-size="10.5" font-weight="600">&bull; User Re-labeling streams back to ML loop</text>

  <!-- Downward arrows in Column 4 -->
  <path d="M 1195 345 L 1195 360" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <path d="M 1195 480 L 1195 495" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>
  <path d="M 1195 595 L 1195 610" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#seq-arrow)"/>

  <!-- Footer -->
  <text x="700" y="930" text-anchor="middle" fill="#64748b" font-size="11">Course Mini Project — DA2 Project Evaluation | Data Flow Architecture &amp; Execution Pipeline | AGENT AMAR</text>
</svg>

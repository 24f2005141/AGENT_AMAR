# Production-like local stack for Sorted.
#
# Roles are separated exactly as in production:
#   api      — public HTTPS surface (behind your TLS proxy), scheduler OFF
#   worker   — the ONE process that syncs Gmail and runs deadline/reminder
#              cycles, scheduler ON
#   db       — PostgreSQL (private network only; no published port)
#   migrate  — runs `alembic upgrade head` once, before api/worker start
#
# Ollama is deliberately NOT in this file: it runs on your own hardware and is
# reached over a private network (see docs/DEPLOYMENT.md). Nothing here should
# ever publish it.
#
# Secrets come from a local .env file that is git-ignored. Never bake them in.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sorted}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sorted}
    volumes:
      - sorted_pgdata:/var/lib/postgresql/data
    # No `ports:` on purpose — the database is reachable only on the internal
    # compose network, never from the host or the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sorted}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Only the worker runs the scheduler; N API replicas must not each
      # start their own Gmail sync loop.
      SCHEDULER_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"   # bind to loopback; terminate TLS in front
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SCHEDULER_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Exactly one worker. Scaling this is NOT safe without adding a shared
    # lock: two workers would double-sync Gmail and double-send push.
    deploy:
      replicas: 1

volumes:
  sorted_pgdata:
